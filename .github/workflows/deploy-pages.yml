name: Deploy GitHub Pages

# O site buildado vive no branch gh-pages, mas o Source do GitHub Pages
# deste repositório está configurado como "GitHub Actions" (não "Deploy
# from a branch"), então nada publicava esse conteúdo. Este workflow
# roda a partir do branch padrão (main) — exigido pela política padrão
# do ambiente "github-pages" — e faz checkout do gh-pages para publicar.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure gh-pages branch exists
        run: |
          git fetch origin gh-pages || true
          if ! git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            echo "Branch gh-pages not found; creating empty branch."
            git checkout --orphan gh-pages
            git rm -rf . || true
            echo "# Claude Config Site" > index.html
            git add index.html
            git commit -m "chore: initialize gh-pages branch"
            git push origin gh-pages
          fi

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
